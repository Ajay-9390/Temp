# ─────────────────────────────────────────────────────────────────────────────
# Development override — starts only PostgreSQL.
# Run backend and frontend locally with hot-reload.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
# Then:
#   cd backend  && ./mvnw spring-boot:run
#   cd frontend && npm run dev
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: nba_attainment_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB:       nba_attainment
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nba_attainment"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local
