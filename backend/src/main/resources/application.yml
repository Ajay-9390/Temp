spring:
  application:
    name: nba-program-management
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nba_program}
    username: ${DB_USERNAME:nba}
    password: ${DB_PASSWORD:nba}
    hikari:
      pool-name: nba-pm-pool
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      # NEVER auto-create/update schema; Flyway owns the schema.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
      org:
        hibernate:
          envers:
            audit_table_suffix: _aud
            store_data_at_delete: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: 600000
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm issuer. In standalone dev, security can be disabled via app.security.enabled=false
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/nba}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/nba/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

app:
  security:
    # When false (local dev without Keycloak), all endpoints are permitted and a mock user is injected.
    enabled: ${APP_SECURITY_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    # Loads development seed data on startup (dev profile only).
    enabled: ${SEED_ENABLED:false}
  accreditation:
    # Configurable tiers — add values here without code changes.
    allowed-tiers: ${ACCREDITATION_TIERS:TIER_I,TIER_II}
    allow-multiple-active-cycles: ${ALLOW_MULTIPLE_ACTIVE_CYCLES:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.example.nba: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [correlationId=%X{correlationId:-}] [user=%X{userId:-}] %-5level %logger{36} - %msg%n"
