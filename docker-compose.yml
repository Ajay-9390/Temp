# ─────────────────────────────────────────────────────────────────────────────
# PO/PSO Attainment Module — Local Development Stack
# ─────────────────────────────────────────────────────────────────────────────
#
# Usage:
#   docker compose up -d            # start all services
#   docker compose logs -f backend  # tail backend logs
#   docker compose down -v          # stop and remove volumes
#
# Services:
#   postgres   — PostgreSQL 16 database
#   backend    — Spring Boot REST API  (http://localhost:8080)
#   frontend   — Next.js dashboard     (http://localhost:3000)
#
# Swagger UI:    http://localhost:8080/swagger-ui/index.html
# API Docs:      http://localhost:8080/api-docs
# Actuator:      http://localhost:8080/actuator/health
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nba_attainment_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       nba_attainment
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nba_attainment"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Spring Boot Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nba_attainment_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/nba_attainment
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE:     default
      APP_CORS_ALLOWED_ORIGINS:   http://localhost:3000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL",
             "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nba_attainment_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
